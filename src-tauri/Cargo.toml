[package]
name = "dittox"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
dittox-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled-full"] }
dirs = "5"
tokio = { version = "1", features = ["full"] }
arboard = "3"
global-hotkey = "0.6"
tray-icon = "0.18"
anyhow = "1"
chrono = "0.4"
sha2 = "0.10"
