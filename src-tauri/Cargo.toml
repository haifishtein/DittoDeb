[package]
name = "ditto-deb"
version = "0.1.0"
description = "Clon de Ditto para Linux Mint: historial de portapapeles, busqueda FTS5 y popup global"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
ditto-deb-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled-full"] }
dirs = "5"
tokio = { version = "1", features = ["full"] }
arboard = "3"
x11-dl = "2"
tray-icon = "0.18"
anyhow = "1"
chrono = "0.4"
sha2 = "0.10"
