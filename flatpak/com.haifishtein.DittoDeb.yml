app-id: com.haifishtein.DittoDeb
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: ditto-deb
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --talk-name=org.kde.klipper
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-data/ditto-deb:create
modules:
  - name: ditto-deb
    buildsystem: cargo
    sources:
      - type: dir
        path: ../
